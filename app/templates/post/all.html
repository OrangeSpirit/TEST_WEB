{% extends 'main/base.html' %}

{% block title %}All Theme :{% endblock %}

{% block style %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blocks/table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/font-awesome.min.css') }}">
{% endblock %}


{% block content %}
<div class="table-responsive custom-table-responsive">
    <table class="table custom-table">
        <thead>
            <th scope="col">Teacher table</th>
            <th scope="col">Theme</th>
            <th scope="col">Student</th>
            <th scope="col">Action</th>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr scope="row">
                <td>{{ post.teacher }}</td>
                <td>{{ post.subject }}</td>
                <td>{{ post.student }}</td>
                <td>
                    <a href="{{ url_for('post.update', id=post.id) }}" class="btn btn-sm btn-secondary"><span class="fa fa-edit"></span></a>
                    <a href="#" class="btn btn-sm btn-danger"><span class="fa fa-trash"></span></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
