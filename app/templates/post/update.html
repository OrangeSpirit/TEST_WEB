{% extends 'main/base.html' %}

{% block title %}Edit Theme {{ post.id }}{% endblock %}

{% block content %}
<form method="post" class="form-control d-flex flex-column gap-2">
    <input value="{{ post.teacher }}" name="teacher" type="text" placeholder="FIO Teacher" class="form-control">
    <input value="{{ post.subject }}" name="subject" type="text" placeholder="Theme" class="form-control">
    <input value="{{ post.student }}" name="student" typy="text" placeholder="FIO Student" class="form-control">
    <input value="Update" type="submit" class="btn btn-success">
</form>
{% endblock %}
